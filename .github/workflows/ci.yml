name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: testing, POSTGRES_USER: laravel, POSTGRES_PASSWORD: password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U laravel -d testing"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: mbstring, pdo_pgsql, tools: composer:v2 }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict --no-check-publish
      - run: git ls-files '*.php' -z | xargs -0 -n1 php -l
      - run: vendor/bin/pint --test
      - run: php artisan app:validate-environment
        env:
          KEYCLOAK_BASE_URL: https://keycloak.example.test
          KEYCLOAK_REALM: umrah
          KEYCLOAK_CLIENT_ID: procurement
          KEYCLOAK_REDIRECT_URI: http://localhost:8000/auth/keycloak/callback
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: laravel
          DB_PASSWORD: password
